<!DOCTYPE html>
<html>
<head>
    <title>Thank You</title>
    <meta http-equiv="refresh" content="2;url=/logout">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .center-message {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px 60px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(6px);
        }

        h1 {
            color: #ffffff;
            font-size: 34px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<video autoplay muted loop id="bgVideo">
    <source src="{{ url_for('static', filename='videos/bg.mp4') }}" type="video/mp4">
</video>

<div class="center-message">
    <div class="content-box">
        <h1>Thank You for Using Our System</h1>
    </div>
</div>

</body>
</html>
